          - Name: CONSOLE_ROLE
            Value: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ConsoleRoleName}"
          - Name: K8S_VERSION
            Value: !Ref KubernetesVersion
          - Name: SSM_RUNCOMMAND_CWLGRP
            Value: !Ref SsmRunCommandCloudWatchLogGroupName
          - Name: WORKSHOP_REPO_CLONE_URL
            Value: !Ref WorkshopRepoCloneUrl
          # Dev_Environment instance discovery (Req 2.17): CodeBuild reads the
          # SSM Run Command target instance ID directly from the stack resource
          # reference, replacing the former tag-based instance lookup.
          - Name: DEV_ENVIRONMENT_INSTANCE_ID
            Value: !Ref DevEnvironmentInstance
          # IAM role that the Dev_Environment instance runs as (via
          # EKSEnvironmentInstanceProfile). Passed to Create-EKS-Cluster as the
          # CLI admin role, replacing the former instance-role ARN.
          - Name: CLI_ROLE
            Value: !GetAtt EKSEnvironmentRole.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo ">>> installed python 3.12"
            pre_build:
              commands:
                - echo ">>> build cluster config"
                - echo ">>> install awscli "
                - pip3 install --upgrade --user awscli
            build:
              commands:
                - |
                  process_command_status () {
                    CMD_ID=$1
                    PREV_EXIT_CODE=$2
                    DEV_ENVIRONMENT_INSTANCE_ID=$3
                    AWS_REGION=$4
                    if [ $PREV_EXIT_CODE -ne 0 ]; then
                      echo ">>> exiting build with failure..."
                      return $PREV_EXIT_CODE
                    fi
                    for i in {1..45}; do
                      echo ">>> sleeping for 1 minute..."
                      sleep 60
                      echo ">>> checking command status for command id= $CMD_ID..."
                      CMD_STATUS=$(aws ssm list-command-invocations \
                        --command-id $CMD_ID \
                        --instance-id $DEV_ENVIRONMENT_INSTANCE_ID \
                        --query CommandInvocations[0].Status \
                        --output text \
                        --region $AWS_REGION)
                      if [ "$CMD_STATUS" = "Pending" ] || [ "$CMD_STATUS" = "InProgress" ]; then
                        echo ">>> command status= $CMD_STATUS"
                      elif [ "$CMD_STATUS" = "Success" ]; then
                        echo ">>> Workshop environment configuration completed successfully"
                        return 0
                      else
                        echo ">>> exiting build with failure, command status= $CMD_STATUS"
                        return 1
                      fi
                    done
                    if [ "$CMD_STATUS" != "Success" ]; then
                      echo ">>> command status did not change to 'Success' within 45 minutes"
                      echo ">>> exiting build with failure..."
                      return 1
                    fi
                  }
                  echo ">>> sending ssm command to configure workshop environment"
                  CMD_ID=$(aws ssm send-command \
                    --document-name "Configure-Workshop-Environment" \
                    --document-version "1" \
                    --targets "[{\"Key\":\"InstanceIds\",\"Values\":[\"$DEV_ENVIRONMENT_INSTANCE_ID\"]}]" \
                    --parameters "{\"Version\":[\"$K8S_VERSION\"],\"ClusterName\":[\"$CLUSTER_NAME\"],\"WorkerNodeInstanceType\":[\"$WORKER_NODE_INSTANCE_TYPE\"],\"PublicSubnets\":[\"$PUBLIC_SUBNETS\"],\"PrivateSubnets\":[\"$PRIVATE_SUBNETS\"],\"ConsoleRole\":[\"$CONSOLE_ROLE\"],\"CliRole\":[\"$CLI_ROLE\"],\"CloneUrl\":[\"$WORKSHOP_REPO_CLONE_URL\"]}" \
                    --timeout-seconds 3000 \
                    --max-concurrency "50" \
                    --max-errors "0" \
                    --cloud-watch-output-config "{\"CloudWatchOutputEnabled\":true,\"CloudWatchLogGroupName\":\"$SSM_RUNCOMMAND_CWLGRP\"}" \
                    --query Command.CommandId \
                    --output text \
                    --region $AWS_REGION)
                  PREV_EXIT_CODE=$?
                  process_command_status $CMD_ID $PREV_EXIT_CODE $DEV_ENVIRONMENT_INSTANCE_ID $AWS_REGION
                  EXIT_CODE=$?
                  if [ $EXIT_CODE -ne 0 ]; then
                    exit $EXIT_CODE
                  fi
                  CMD_ID=$(aws ssm send-command \
                    --document-name "Bootstrap-Git-And-Management-Cluster" \
                    --document-version "1" \
                    --targets "[{\"Key\":\"InstanceIds\",\"Values\":[\"$DEV_ENVIRONMENT_INSTANCE_ID\"]}]" \
                    --timeout-seconds 3000 \
                    --max-concurrency "50" \
                    --max-errors "0" \
                    --cloud-watch-output-config "{\"CloudWatchOutputEnabled\":true,\"CloudWatchLogGroupName\":\"$SSM_RUNCOMMAND_CWLGRP\"}" \
                    --query Command.CommandId \
                    --output text \
                    --region $AWS_REGION)
                  PREV_EXIT_CODE=$?
                  process_command_status $CMD_ID $PREV_EXIT_CODE $DEV_ENVIRONMENT_INSTANCE_ID $AWS_REGION
                  EXIT_CODE=$?
                  if [ $EXIT_CODE -ne 0 ]; then
                    exit $EXIT_CODE
                  fi
            post_build:
              commands: 
                # CODEBUILD_BUILD_SUCCEEDING = 1 Set to 0 if the build is failing, or 1 if the build is succeeding.
                - echo ">>> build status $CODEBUILD_BUILD_SUCCEEDING "
                - |
                  if [ "$CODEBUILD_BUILD_SUCCEEDING" -eq "1" ]
                  then
                    curl -X PUT -H 'Content-Type:' --data-binary '{"Status" : "SUCCESS","Reason" : "Creation Complete", "UniqueId" : "$CODEBUILD_BUILD_ID","Data" : "Creation complete"}' $CFN_RESPONSE_URL
                  else
                    curl -X PUT -H 'Content-Type:' --data-binary '{"Status" : "FAILURE","Reason" : "Creation Failed", "UniqueId" : "$CODEBUILD_BUILD_ID","Data" : "See Codebuild logs for details. $CODEBUILD_LOG_PATH"}' $CFN_RESPONSE_URL
                  fi
      TimeoutInMinutes: 120

  WaitForStackCreationHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    # dont start till we create a lambda function
    DependsOn: [CustomTriggerBuild]
    Properties:
      Handle: !Ref WaitForStackCreationHandle
      # wait for 120 minutes before giving up
      Timeout: "7200"
      # success or failure signal count
      Count: 1

  CustomTriggerBuild:
    Type: Custom::TriggerCodeBuild
    # Readiness gate (Req 2.24): CodeBuild — which runs the setup documents — is
    # not triggered until the Dev_Environment health check has passed. If the
    # environment is not reachable within the health-check window, DevEnvironmentHealthcheck
    # fails the stack (naming the Dev_Environment) and the setup documents never run.
    DependsOn:
      - DevEnvironmentHealthcheck
      - CheckDevEnvironmentSSMDoc
    Properties:
      ServiceToken: !GetAtt TriggerBuildLambda.Arn
      CodebuildProjectName: !Ref BuildProject

  TriggerBuildLambdaIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: !Sub IAMPolicy-${AWS::StackName}
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:*
                Resource: !GetAtt BuildProject.Arn

  TriggerBuildLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: function to retrive User info
      Handler: index.handler
      Role: !GetAtt TriggerBuildLambdaIamRole.Arn
      Runtime: python3.13
      Code:
        ZipFile: |
          import boto3
          import logging
          import sys
          import json
          import urllib3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          http = urllib3.PoolManager()

          codebuild_client = boto3.client('codebuild')

          # https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cfn-lambda-function-code-cfnresponsemodule.html
          def handler(event, context):
              logger.info('Incoming Event: {0}'.format(event))
              response = {}
              response['PhysicalResourceId'] = 'hardcodedphyscialid'
              response['StackId'] = event['StackId']
              response['RequestId'] = event['RequestId']    
              response['LogicalResourceId'] = event['LogicalResourceId']
              cfn_response_url = event['ResponseURL']

              if event['RequestType'] == 'Delete':
                  # return 
                  logger.info('Nothing to do. Request Type : {0}'.format(event['RequestType']))
                  response['Status'] = 'SUCCESS'

              elif event['RequestType'] == 'Create' or event['RequestType'] == 'Update':

                try:
                  codebuild_client.start_build(projectName=event['ResourceProperties']['CodebuildProjectName'])
                  response['Status'] = 'SUCCESS'

                except:
                  logging.error('Error: {0}'.format(sys.exc_info() ))
                  response['Status'] = 'FAILED'

              http.request('PUT', cfn_response_url, body=json.dumps(response).encode('utf-8'), headers={'Content-Type': 'application/json'})
              return 'Done'

  # Base Stack
  CWLogGroup:
    Type: AWS::Logs::LogGroup

  # VPC in which containers will be networked.
  # It has two public subnets, and two private subnets.
  # We distribute the subnets across the first two available subnets
  # for the region, for high availability.
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsSupport: true
      EnableDnsHostnames: true
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-VPC-${AWS::StackName}

  # Two public subnets, where a public load balancer will later be created.
  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: { Ref: "AWS::Region" }
      VpcId: !Ref "VPC"
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}PublicOne-${AWS::StackName}
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"
  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: { Ref: "AWS::Region" }
      VpcId: !Ref "VPC"
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}PublicTwo-${AWS::StackName}
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: "1"

  # Two private subnets where containers will only have private
  # IP addresses, and will only be reachable by other members of the
  # VPC
  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: { Ref: "AWS::Region" }
      VpcId: !Ref "VPC"
      CidrBlock: 10.0.2.0/24
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}PrivateOne-${AWS::StackName}
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared
  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: { Ref: "AWS::Region" }
      VpcId: !Ref "VPC"
      CidrBlock: 10.0.3.0/24
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}PrivateTwo-${AWS::StackName}
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared

  # Setup networking resources for the public subnets.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachement:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref "VPC"
      InternetGatewayId: !Ref "InternetGateway"
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref "VPC"
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachement
    Properties:
      RouteTableId: !Ref "PublicRouteTable"
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref "InternetGateway"
  PublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetOne
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetTwo
      RouteTableId: !Ref PublicRouteTable

  # Setup networking resources for the private subnets. Containers
  # in these subnets have only private IP addresses, and must use a NAT
  # gateway to talk to the internet. We launch a single-AZ NAT gateway.
  NatGatewayOneAttachment:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachement
    Properties:
      Domain: vpc
  NatGatewayOne:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayOneAttachment.AllocationId
      SubnetId: !Ref PublicSubnetOne
  PrivateRouteTableOne:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref "VPC"
  PrivateRouteOne:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableOne
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayOne
  PrivateRouteTableOneAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableOne
      SubnetId: !Ref PrivateSubnetOne
  PrivateRouteTableTwo:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref "VPC"
  PrivateRouteTwo:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableTwo
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayOne
  PrivateRouteTableTwoAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableTwo
      SubnetId: !Ref PrivateSubnetTwo

  S3VPCEnpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
      RouteTableIds: 
        - !Ref PrivateRouteTableOne
        - !Ref PrivateRouteTableTwo
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType:  Gateway
      VpcId: !Ref "VPC"

  DynamoDBVPCEnpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
      RouteTableIds: 
        - !Ref PrivateRouteTableOne
        - !Ref PrivateRouteTableTwo
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType:  Gateway
      VpcId: !Ref "VPC"
  # =====================================================================
  # G. Dev_Environment — VS Code in the browser on Amazon EC2, reachable
  # over HTTPS through Amazon CloudFront. Replaces the development
  # environment removed in task 10.1, following the resource pattern of the
  # reference template initial-setup/auto/reference/code-editor.yaml.
  # The SSM Run Command orchestration is retargeted to this instance by
  # task 10.4; here the instance is named clearly (logical id
  # DevEnvironmentInstance) so that task can reference it.
  # =====================================================================

  # Access credential generated into AWS Secrets Manager. No literal
  # credential value appears anywhere in this template (Req 2.23).
  DevEnvironmentSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub
        - dev-environment-${RandomGUID}
        - RandomGUID: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]]
      Description: Dev_Environment VS Code login credential
      GenerateSecretString:
        PasswordLength: 16
        SecretStringTemplate: !Sub '{"username":"${DevEnvironmentUser}"}'
        GenerateStringKey: "password"
        ExcludePunctuation: true

  # Helper that returns the generated secret's plaintext so the value can be
  # injected into the bootstrap document (as the VS Code auth token) and the
  # stack output URL, without ever stating the credential literally.
  DevEnvironmentSecretPlaintextLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AwsSecretsManager
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DevEnvironmentSecret

  DevEnvironmentSecretPlaintextLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: Return the value of the Dev_Environment secret
      Handler: index.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10
      Architectures:
        - arm64
      Role: !GetAtt DevEnvironmentSecretPlaintextLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def is_valid_json(json_string):
              try:
                  json.loads(json_string)
                  return True
              except json.JSONDecodeError:
                  return False

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action to take')
                  else:
                      resource_properties = event['ResourceProperties']
                      secret_name = resource_properties['SecretArn']
                      secrets_mgr = boto3.client('secretsmanager')
                      secret = secrets_mgr.get_secret_value(SecretId=secret_name)
                      secret_value = secret['SecretString']
                      responseData = secret_value if is_valid_json(secret_value) else json.dumps({'secret': secret_value})
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData=json.loads(responseData), reason='OK', noEcho=True)
              except Exception as e:
                  logger.error(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=str(e))

  DevEnvironmentSecretPlaintext:
    Type: Custom::DevEnvironmentSecretPlaintext
    Properties:
      ServiceToken: !GetAtt DevEnvironmentSecretPlaintextLambda.Arn
      ServiceTimeout: 15
      SecretArn: !Ref DevEnvironmentSecret

  # Bootstrap document: installs and starts VS Code (code-editor) served from
  # the instance behind nginx, on Amazon Linux 2023. Named CodeEditorSSMDoc to
  # match the design (area G).
  CodeEditorSSMDoc:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      Content:
        schemaVersion: "2.2"
        description: Bootstrap the Dev_Environment VS Code instance
        parameters:
          LinuxFlavor:
            type: String
            default: "al2023"
          CodeEditorPassword:
            type: String
            default: !Ref AWS::StackId
        mainSteps:
          - name: InstallBasePackagesDnf
            action: aws:runShellScript
            precondition:
              StringEquals:
                - "{{ LinuxFlavor }}"
                - al2023
            inputs:
              timeoutSeconds: 300
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - dnf install -y --allowerasing curl gnupg whois argon2 unzip nginx openssl jq git
          - name: AddUser
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - !Sub |
                  echo 'Adding user: ${DevEnvironmentUser}'
                  id -u ${DevEnvironmentUser} >/dev/null 2>&1 || adduser -c '' ${DevEnvironmentUser}
                  passwd -l ${DevEnvironmentUser}
                  echo "${DevEnvironmentUser}:{{ CodeEditorPassword }}" | chpasswd
                  usermod -aG wheel ${DevEnvironmentUser}
                  sed -i 's/# %wheel/%wheel/g' /etc/sudoers
                - !Sub getent passwd ${DevEnvironmentUser}
          - name: UpdateProfile
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - echo LANG=en_US.utf-8 >> /etc/environment
                - echo LC_ALL=en_US.UTF-8 >> /etc/environment
                - !Sub echo 'PATH=$PATH:/home/${DevEnvironmentUser}/.local/bin' >> /home/${DevEnvironmentUser}/.bashrc
                - !Sub echo 'export PATH' >> /home/${DevEnvironmentUser}/.bashrc
                - !Sub echo 'export AWS_REGION=${AWS::Region}' >> /home/${DevEnvironmentUser}/.bashrc
                - !Sub echo 'export AWS_ACCOUNTID=${AWS::AccountId}' >> /home/${DevEnvironmentUser}/.bashrc
                - !Sub chown -R ${DevEnvironmentUser}:${DevEnvironmentUser} /home/${DevEnvironmentUser}
          - name: InstallAWSCLI
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - !Sub sudo -u ${DevEnvironmentUser} curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip -o /tmp/aws-cli.zip
                - unzip -q -d /tmp /tmp/aws-cli.zip
                - sudo /tmp/aws/install --update
                - rm -rf /tmp/aws
                - aws --version
          - name: InstallGit
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 300
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - dnf install -y python3-pip
                - !Sub sudo -u ${DevEnvironmentUser} PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install git-remote-codecommit
                - !Sub sudo -u ${DevEnvironmentUser} git config --global user.email "participant@example.com"
                - !Sub sudo -u ${DevEnvironmentUser} git config --global user.name "Workshop Participant"
                - !Sub sudo -u ${DevEnvironmentUser} git config --global init.defaultBranch "main"
                - git --version
          - name: InstallCodeEditor
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - !Sub export CodeEditorUser=${DevEnvironmentUser}
                - curl -fsSL https://code-editor.amazonaws.com/content/code-editor-server/dist/aws-workshop-studio/install.sh | bash -s -- 2>&1 || { echo "Code Editor installation failed"; exit 1; }
          - name: ConfigureNginx
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - echo "Configuring nginx..."
                - |
                  tee /etc/nginx/conf.d/code-editor.conf <<EOF
                  server {
                      listen 80;
                      listen [::]:80;
                      server_name *.cloudfront.net;
                      proxy_set_header Host \$host;
                      proxy_set_header X-Real-IP \$remote_addr;
                      proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto \$scheme;
                      proxy_set_header Upgrade \$http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_buffering off;
                      proxy_set_header Accept-Encoding gzip;
                      location / {
                          proxy_pass http://localhost:8080/;
                      }
                  }
                  EOF
                - systemctl enable nginx 2>&1
                - systemctl restart nginx
                - nginx -t 2>&1
          - name: ConfigureAuthToken
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - !Sub |
                  sudo -u ${DevEnvironmentUser} mkdir -p /home/${DevEnvironmentUser}/.code-editor-server/data
                  sudo -u ${DevEnvironmentUser} touch /home/${DevEnvironmentUser}/.code-editor-server/data/token
                  echo -n "{{ CodeEditorPassword }}" > /home/${DevEnvironmentUser}/.code-editor-server/data/token
          - name: ConfigureCodeEditor
            action: aws:runShellScript
            inputs:
              timeoutSeconds: 600
              runCommand:
                - "#!/bin/bash"
                - set -euo pipefail
                - !Sub sudo -i -u ${DevEnvironmentUser} mkdir -p /home/${DevEnvironmentUser}/.code-editor-server/data/User
                - !Sub mkdir -p ${DevEnvironmentHomeFolder} && chown -R ${DevEnvironmentUser}:${DevEnvironmentUser} ${DevEnvironmentHomeFolder}
                - !Sub printf 'WORKSHOP_USER=%s\nWORKSHOP_HOME=%s\n' '${DevEnvironmentUser}' '${DevEnvironmentHomeFolder}' > /etc/workshop.env
                - !Sub |
                  tee /home/${DevEnvironmentUser}/.code-editor-server/data/User/settings.json <<EOF
                  {
                    "aws.telemetry": false,
                    "telemetry.telemetryLevel": "off",
                    "security.workspace.trust.enabled": false,
                    "workbench.startupEditor": "none",
                    "terminal.integrated.cwd": "${DevEnvironmentHomeFolder}"
                  }
                  EOF
                - !Sub chown -R ${DevEnvironmentUser}:${DevEnvironmentUser} /home/${DevEnvironmentUser}
                - !Sub systemctl enable --now code-editor@${DevEnvironmentUser}
                - !Sub systemctl restart code-editor@${DevEnvironmentUser}
                - !Sub systemctl status code-editor@${DevEnvironmentUser}

  # Role shared by the run/check Lambdas that drive the bootstrap document.
  DevEnvironmentSSMDocLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SSMDocOnEC2
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${CodeEditorSSMDoc}
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${DevEnvironmentInstance}
              - Effect: Allow
                Action:
                  - ssm:ListCommandInvocations
                  - ssm:GetCommandInvocation
                Resource: "*"

  RunDevEnvironmentSSMDocLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: Run the bootstrap SSM document on the Dev_Environment instance
      Handler: index.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 600
      Environment:
        Variables:
          RetrySleep: 2900
          AbortTimeRemaining: 5000
      Architectures:
        - arm64
      Role: !GetAtt DevEnvironmentSSMDocLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          import time
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              if event['RequestType'] != 'Create':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action to take')
                  return
              sleep_ms = int(os.environ.get('RetrySleep'))
              abort_time_remaining_ms = int(os.environ.get('AbortTimeRemaining'))
              rp = event['ResourceProperties']
              instance_id = rp['InstanceId']
              document_name = rp['DocumentName']
              cloudwatch_log_group_name = rp['CloudWatchLogGroupName']
              for k in ['ServiceToken', 'ServiceTimeout', 'InstanceId', 'DocumentName', 'CloudWatchLogGroupName', 'PhysicalResourceId']:
                  rp.pop(k, None)
              parameters = {key: [value] for key, value in rp.items()}
              ssm = boto3.client('ssm')
              retry = True
              attempt_no = 0
              while retry:
                  attempt_no += 1
                  time_remaining_ms = context.get_remaining_time_in_millis()
                  try:
                      response = ssm.send_command(
                          InstanceIds=[instance_id],
                          DocumentName=document_name,
                          CloudWatchOutputConfig={'CloudWatchLogGroupName': cloudwatch_log_group_name, 'CloudWatchOutputEnabled': True},
                          Parameters=parameters
                      )
                      command_id = response['Command']['CommandId']
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'CommandId': command_id}, reason='OK')
                      retry = False
                  except ssm.exceptions.InvalidInstanceId as e:
                      if time_remaining_ms > abort_time_remaining_ms:
                          logger.info(f'Instance {instance_id} not ready. Sleeping {sleep_ms/1000}s')
                          time.sleep(sleep_ms/1000)
                      else:
                          logger.error(e, exc_info=True)
                          cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason='Instance not ready, timed out')
                          retry = False
                  except Exception as e:
                      logger.error(e, exc_info=True)
                      cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=str(e))
                      retry = False

  RunDevEnvironmentSSMDoc:
    Type: Custom::RunDevEnvironmentSSMDoc
    Properties:
      ServiceToken: !GetAtt RunDevEnvironmentSSMDocLambda.Arn
      ServiceTimeout: 305
      InstanceId: !Ref DevEnvironmentInstance
      DocumentName: !Ref CodeEditorSSMDoc
      CloudWatchLogGroupName: !Sub /aws/ssm/${CodeEditorSSMDoc}
      CodeEditorPassword: !GetAtt DevEnvironmentSecretPlaintext.password
      LinuxFlavor: al2023

  # Security group whose ONLY inbound rule sources the AWS-managed CloudFront
  # origin-facing prefix list for the stack's Region (Req 2.22). No other
  # inbound rule is declared.
  DevEnvironmentSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dev_Environment - allow inbound only from the CloudFront origin-facing prefix list
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: Allow HTTP from com.amazonaws.global.cloudfront.origin-facing
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !FindInMap [AWSRegionsPrefixListID, !Ref "AWS::Region", PrefixList]
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-dev-environment-sg-${AWS::StackName}

  # Dev_Environment EC2 instance. Amazon Linux 2023 (Req 2.20). The instance
  # profile (Req 2.18) and the root volume size (Req 2.19) are BOTH stated in
  # this declaration: there is no post-creation profile association, reboot,
  # managed-credentials disable, or volume resize anywhere in the stack.
  # The retained EKSEnvironmentInstanceProfile / EKSEnvironmentRole are reused.
  DevEnvironmentInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If
        - IsGravitonDevEnv
        - !FindInMap [DevEnvironmentAMI, arm64, ImageId]
        - !FindInMap [DevEnvironmentAMI, x86-64, ImageId]
      InstanceType: !Ref DevEnvironmentInstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref DevEnvironmentVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Monitoring: true
      SubnetId: !Ref PublicSubnetOne
      SecurityGroupIds:
        - !Ref DevEnvironmentSecurityGroup
      IamInstanceProfile: !Ref EKSEnvironmentInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #cloud-config
          hostname: dev-environment
          runcmd:
            - mkdir -p ${DevEnvironmentHomeFolder} && chown -R ${DevEnvironmentUser}:${DevEnvironmentUser} ${DevEnvironmentHomeFolder}
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-dev-environment-${AWS::StackName}

  DevEnvironmentEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  DevEnvironmentEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt DevEnvironmentEIP.AllocationId
      InstanceId: !Ref DevEnvironmentInstance

  DevEnvironmentCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 1
        Name: !Sub
          - dev-environment-${RandomGUID}
          - RandomGUID: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]]
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: all
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept-Charset
              - Authorization
              - Origin
              - Accept
              - Referer
              - Host
              - Accept-Language
              - Accept-Datetime
          QueryStringsConfig:
            QueryStringBehavior: all

  # CloudFront distribution: the only public entry point to the Dev_Environment.
  # It reaches the instance over HTTP on the origin (the instance security group
  # admits only the CloudFront prefix list) and serves viewers over HTTPS
  # (Req 2.13).
  DevEnvironmentDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: DevEnvironmentEIPAssociation
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachePolicyId: !Ref DevEnvironmentCachePolicy
          Compress: true
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          TargetOriginId: !Sub CloudFront-${AWS::StackName}
          ViewerProtocolPolicy: redirect-to-https
        Origins:
          - DomainName: !GetAtt DevEnvironmentInstance.PublicDnsName
            Id: !Sub CloudFront-${AWS::StackName}
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  # Readiness health check (Req 2.24). Polls the Dev_Environment URL until it is
  # reachable. If it does not become reachable within the polling window the
  # custom resource FAILS, which fails the stack naming DevEnvironmentHealthcheck
  # as the failing resource; CustomTriggerBuild depends on it, so the setup
  # documents never run. The Lambda runs to its 900s (15 min) maximum and,
  # combined with the upstream bootstrap-completion check, enforces the
  # 20-minute readiness gate before CodeBuild is triggered.
  DevEnvironmentHealthCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub lambda.${AWS::URLSuffix}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  DevEnvironmentHealthCheckLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: Run health check on the Dev_Environment instance
      Handler: index.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 900
      Environment:
        Variables:
          RetrySleep: 15000
          AbortTimeRemaining: 30000
      Architectures:
        - arm64
      Role: !GetAtt DevEnvironmentHealthCheckLambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import cfnresponse
          import logging
          import time
          import os
          import http.client
          from urllib.parse import urlparse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def healthURLOk(url):
              try:
                  parsed_url = urlparse(url)
                  if parsed_url.scheme == 'https':
                      conn = http.client.HTTPSConnection(parsed_url.netloc, timeout=10)
                  else:
                      conn = http.client.HTTPConnection(parsed_url.netloc, timeout=10)
                  conn.request("GET", parsed_url.path or "/")
                  response = conn.getresponse()
                  content = response.read()
                  if 200 <= response.status < 400:
                      response_dict = json.loads(content.decode('utf-8'))
                      if 'hasActiveConnections' in response_dict:
                          logger.info('Health check OK.')
                          return True
                      logger.info(f'Health check failed. Response: {response_dict}')
                      return False
                  logger.info(f'Healthcheck failed. Return code: {response.status}')
                  return False
              except Exception as e:
                  logger.info(f'Healthcheck failed: {e}')
                  return False
              finally:
                  if 'conn' in locals():
                      conn.close()

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] != 'Create':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action to take')
                      return
                  sleep_ms = int(os.environ.get('RetrySleep'))
                  abort_time_remaining_ms = int(os.environ.get('AbortTimeRemaining'))
                  url = event['ResourceProperties']['Url']
                  logger.info(f'Testing url: {url}')
                  time_remaining_ms = context.get_remaining_time_in_millis()
                  attempt_no = 0
                  health_check = False
                  while attempt_no == 0 or (time_remaining_ms > abort_time_remaining_ms and not health_check):
                      attempt_no += 1
                      health_check = healthURLOk(url)
                      if not health_check:
                          time.sleep(sleep_ms/1000)
                      time_remaining_ms = context.get_remaining_time_in_millis()
                  if health_check:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='Dev_Environment healthcheck successful')
                  else:
                      cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason='Dev_Environment not reachable within the readiness window; failing resource: DevEnvironmentHealthcheck')
              except Exception as e:
                  logger.error(e, exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=str(e))

  DevEnvironmentHealthcheck:
    Type: Custom::DevEnvironmentHealthCheck
    DependsOn: RunDevEnvironmentSSMDoc
    Properties:
      ServiceToken: !GetAtt DevEnvironmentHealthCheckLambda.Arn
      ServiceTimeout: 910
      Url: !Sub https://${DevEnvironmentDistribution.DomainName}/healthz

  # Confirms the bootstrap document reached Success on the instance. Combined
  # with the health check, this gates CustomTriggerBuild (Req 2.24).
  CheckDevEnvironmentSSMDocLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: Check the bootstrap SSM document on the Dev_Environment instance
      Handler: index.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 600
      Environment:
        Variables:
          RetrySleep: 15000
          AbortTimeRemaining: 30000
      Architectures:
        - arm64
      Role: !GetAtt DevEnvironmentSSMDocLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import logging
          import time
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def lambda_handler(event, context):
              if event['RequestType'] != 'Create':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='No action to take')
                  return
              sleep_ms = int(os.environ.get('RetrySleep'))
              abort_time_remaining_ms = int(os.environ.get('AbortTimeRemaining'))
              rp = event['ResourceProperties']
              instance_id = rp['InstanceId']
              document_name = rp['DocumentName']
              ssm = boto3.client('ssm')
              retry = True
              while retry:
                  time_remaining_ms = context.get_remaining_time_in_millis()
                  try:
                      response = ssm.list_command_invocations(InstanceId=instance_id, Details=True)
                      for invocation in response['CommandInvocations']:
                          if invocation['DocumentName'] == document_name:
                              status = invocation['Status']
                              if status == 'Success':
                                  cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData={}, reason='OK')
                                  retry = False
                              elif status in ('Failed', 'Cancelled', 'TimedOut'):
                                  cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=f'Bootstrap document {document_name} {status}')
                                  retry = False
                      if retry:
                          if time_remaining_ms > abort_time_remaining_ms:
                              time.sleep(sleep_ms/1000)
                          else:
                              cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason='Timed out waiting for bootstrap document')
                              retry = False
                  except Exception as e:
                      logger.error(e, exc_info=True)
                      cfnresponse.send(event, context, cfnresponse.FAILED, responseData={}, reason=str(e))
                      retry = False

  CheckDevEnvironmentSSMDoc:
    Type: Custom::CheckDevEnvironmentSSMDoc
    DependsOn: DevEnvironmentHealthcheck
    Properties:
      ServiceToken: !GetAtt CheckDevEnvironmentSSMDocLambda.Arn
      ServiceTimeout: 610
      InstanceId: !Ref DevEnvironmentInstance
      DocumentName: !Ref CodeEditorSSMDoc

Outputs:
  # Reachable Dev_Environment URL (Req 2.21). The credential is read from the
  # generated Secrets Manager secret at deploy time — no literal credential
  # value appears in the template (Req 2.23).
  DevEnvironmentURL:
    Description: Dev_Environment VS Code URL
    Value: !Sub https://${DevEnvironmentDistribution.DomainName}/?folder=${DevEnvironmentHomeFolder}&tkn=${DevEnvironmentSecretPlaintext.password}
