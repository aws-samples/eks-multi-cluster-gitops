        - PolicyName: TeamRolePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:*
                  - ecr:*
                  - codebuild:*
                  - cloudformation:*
                  - cloudwatch:*
                  - ec2:*
                  - ecs:*
                  - elasticloadbalancing:*
                  - eks:*
                  - logs:*
                  - s3:*
                  - ssm:*
                  - dynamodb:*
                  - iam:*
                  - autoscaling:*
                  - appmesh:*
                  - xray:*
                  - sns:*
                  - codepipeline:*
                  - ec2messages:*
                  - ssmmessages:*
                  - secretsmanager:*
                  - codecommit:*
