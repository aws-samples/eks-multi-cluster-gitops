      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - cloudformation.amazonaws.com
                - codebuild.amazonaws.com
                - eks.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
