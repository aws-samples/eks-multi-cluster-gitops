---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aws-load-balancer-controller
  namespace: flux-system
spec:
  prune: true
  interval: 10m0s
  path: ./tools/aws-load-balancer-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  # aws-load-balancer-controller v3.5.0 needs AWS_REGION and VPC_ID substituted
  # into its HelmRelease values (it can't reach IMDS to discover the VPC id;
  # workload node group IMDS hop limit is 1). Sourced per-cluster from the
  # cluster-info ConfigMap, matching karpenter-config.yaml / kubecost.yaml.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-info
        optional: false
  dependsOn:
  - name: aws-load-balancer-controller-iam
  patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: aws-load-balancer-controller
      namespace: flux-system
    patch: |-
      - op: add
        path: /spec/values/clusterName
        value: cluster-name
---