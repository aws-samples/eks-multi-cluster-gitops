# FINDING 25 (live end-to-end run, task 8.4 correction, area D). The
# aws-load-balancer-controller 3.5.0 (controller v3) chart FAILS at startup on
# this solution's workload clusters: the pod crash-loops with "failed to get
# VPC ID ... ec2imds GetMetadata ... context deadline exceeded". Root cause:
# the Crossplane-composed workload managed NodeGroup runs with the EC2 IMDS
# hop limit of 1, so controller pods (one network hop from the host) cannot
# reach IMDS to discover the VPC id. Controller v2 (chart 1.4.6) tolerated a
# missing IMDS VPC lookup; v3 hard-fails. This is a v2->v3 behaviour change the
# offline values-schema diff could not see. Resolution (no node/IMDS change):
# supply the controller its region and VPC id explicitly through the chart
# values `region` and `vpcId`, sourced per-cluster from the workload
# `cluster-info` ConfigMap via a `spec.postBuild.substituteFrom` added to
# `repos/gitops-system/clusters/template/aws-load-balancer-controller.yaml`
# (same pattern as karpenter-config.yaml / kubecost.yaml). `region` reads the
# ConfigMap's `AWS_REGION` key and `vpcId` reads a NEW `VPC_ID` key added to
# both workload cluster-info ConfigMaps in
# `tools-config/crossplane-eks-composition/composition.yaml`; `VPC_ID` is
# populated from the composed VPC's `status.atProvider.vpcId`, surfaced onto
# the composite as `status.vpc_id` and mapped by the `cluster-info-mappings`
# patchSet like the other data keys. The fix also required declaring
# `status.vpc_id` (type string) in the XRD's status schema
# (`compositeresourcedefinition.yaml`); without it Crossplane drops the
# ToCompositeFieldPath write and the Required ConfigMap patch blocks with
# "Unsynced resources".
