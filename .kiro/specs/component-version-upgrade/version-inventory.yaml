# FINDING 19 (task 1.3, completes duplicate-group assignment). Task 1.2 left
# 44 groups covering 94 entries; 201 further entries were multi-occurrence
# but ungrouped, including every repeated API group-version. Those are
# Duplicated_References under the glossary — the same Pinned_Component, for
# the same purpose, in at least one other file — so criteria 6 and 7 apply
# and 21 groups were added, the largest being
# `crossplane-iam-group-version` (55 occurrences over 18 files),
# `kustomize-config-api-version` (37 over 37) and
# `flux-kustomization-group-version` (36 over 34). Two rules were needed to
# make the assignment decidable, and both are recorded here rather than
# inferred:
#   a. SCOPE. A group is assigned to every set of two or more occurrences of
#      one Pinned_Component that must state one identical string, whether or
#      not the occurrences span files. Three groups are single-file sets
#      (`crossplane-ec2-group-version` 13 occurrences in composition.yaml,
#      `kubectl-release-date-cfn` 3 in cfn.yaml,
#      `external-secrets-group-version` 2 in sealed-secrets-key.yaml). They
#      are not Duplicated_References by the glossary's "at least one other
#      file" wording, but grouping them costs nothing and gives check 9 a
#      per-occurrence assertion. The Duplicated_Reference subset is exactly
#      those groups whose members hold two or more distinct `file` values,
#      which keeps criterion 6 decidable.
#   b. SPLITTING BY TARGET, NOT BY NAME. Occurrences of one group-version
#      that resolve to DIFFERENT targets are different sets. The instance is
#      `karpenter.k8s.aws/v1beta1`: three occurrences move to
#      `karpenter.k8s.aws/v1` and form `karpenter-ec2nodeclass-group-version`,
#      while the fourth — the `NodePool.spec.template.spec.nodeClassRef`
#      apiVersion — is a structural change to the v1 `group`/`kind`/`name`
#      form, so it stays ungrouped rather than being forced to share a
#      target it cannot state.
#   Consequence for check 9: 22 of the grouped occurrences are
#   `spec.patches[].target.group` + `.version` pairs (FINDING 7), where the
#   file states the group and the version under two separate keys. Their
#   `current` and `target` are recorded as the COMPOSED `group/version`
#   string, so check 9 must join the two keys with `/` before comparing at
