  - component: openid-connect-provider thumbprint
    category: aws-resource
    file: repos/gitops-system/tools-config/crossplane-eks-composition/composition.yaml
    locator: spec.resources[cluster-oidc-idp].base.spec.forProvider.thumbprintList[0] (line 606)
    current: 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
    target: 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
    status: upgrade
    source_url: https://raw.githubusercontent.com/crossplane-contrib/provider-aws/v0.59.0/package/crds/iam.aws.crossplane.io_openidconnectproviders.yaml
    consulted: 2026-11-24
    notes: >-
      RESOLVED — documented well-known constant (supersedes DERIVATION 2).
      target equals current, so per FINDING 15 the residual `upgrade` flag
      applies: none of the five conditional flags fires, a source of record
      exists and is recorded in source_url, and no edit to the value is
      required at the occurrence. `no-source` was rejected because a source
      of record does exist (the pinned CRD plus the documented AWS root CA)
      and adopting it would force source_url to be omitted; `removed` no
      longer applies because the value is retained, not eliminated.

      DERIVATION 2 (patch) IS SUPERSEDED. A live end-to-end run against a
      real AWS account showed DERIVATION 2 produced an AWS-invalid value:
      the task 4.4 patch drove thumbprintList[0] from
      status.eks_cluster_oidc_issuer_url — the issuer URL (~60 chars) — but
      IAM requires each thumbprintList member to be exactly a 40-char hex
      SHA-1 thumbprint and rejected it with "Member must have length equal
      to 40". Crossplane patches cannot compute a SHA-1, and the CRD in
      provider-aws v0.59.0 lists thumbprintList in `required` with
      minItems: 1 (so the field cannot be omitted or left empty).

      RESOLUTION. thumbprintList[0] is set to the documented well-known AWS
      OIDC root-CA thumbprint constant 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
      (Starfield Services Root CA G2 — the repo's original value). For EKS
      OIDC endpoints AWS validates against its own trusted-CA store and does
      not rely on the supplied value; it only enforces the 40-char format.
      The Starfield root CA is long-lived, so a stale-fingerprint failure is
      not a practical risk. The invalid thumbprint patch is removed; the
      status.eks_cluster_oidc_issuer_url -> spec.forProvider.url patch is
      kept. Requirement 4.17 was relaxed to permit this single documented
      well-known constant (with the comment recorded in the composition)
      while still forbidding per-cluster or hand-copied thumbprints that
      could silently go stale.


