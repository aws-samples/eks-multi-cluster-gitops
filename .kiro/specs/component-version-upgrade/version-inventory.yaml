# Version Inventory — component-version-upgrade
#
# The recorded output of the Version_Scan. Consumed directly by the
# Verification_Process for the duplicated-reference consistency check
# (verification check 9, Requirement 10 criterion 13) and the documentation
# drift check (verification check 11, Requirement 9 criterion 17). No rendered
# markdown view of this file is maintained, so that versions have exactly one
# home.
#
# ---------------------------------------------------------------------------
# STRUCTURE
# ---------------------------------------------------------------------------
#
# A mapping with a single `entries` key holding a sequence. Each entry is one
# Version_Reference: one occurrence of one version string in one file.
#
# ONE ENTRY PER OCCURRENCE. `file` is a single repository-relative path and is
# never a list. A Pinned_Component whose version is stated in five files
# produces five entries, not one entry with five paths. This is what makes
# Requirement 1 criterion 2 decidable — entry count equals occurrence count —
# and it is what lets verification check 9 report a divergent occurrence by its
# own path.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
#
# Required on every entry:
#
#   component   Pinned_Component name, e.g. `flux-source-controller`
#   category    One of: k8s-version, helm-chart, container-image,
#               crossplane-package, k8s-api-version, cli-tool, python-dist,
#               npm-package, aws-resource
#   file        Repository-relative path — a single path, never a list
#   locator     YAML field path, environment variable name, or line number
#               containing the version string
#   current     Version string exactly as it appears in the file
#   target      Target_Version
#   status      Exactly one of the six status flags below
#
# Conditional:
#
#   successor        Required when `status` is `superseded` or `removed`.
#                    Names the replacing artifact or component.
#   source_url       URL of the source of record. Required unless `status` is
#                    `no-source`.
#   consulted        ISO-8601 date the source was consulted. Required whenever
#                    `source_url` is present.
#   duplicate_group  Shared identifier carried by every entry of a
#                    Duplicated_Reference. Absent on a single-occurrence
#                    reference.
#
# Optional:
#
#   notes            Migration mechanics, e.g. a field rename forced by the
#                    target.
#
# ---------------------------------------------------------------------------
# STATUS FLAGS — exactly one applies per entry
# ---------------------------------------------------------------------------
#
#   upgrade       Ordinary bump. `current` resolves upstream and a newer
#                 release exists. (Requirement 1.3)
#
#   unresolvable  `current` is absent from the upstream registry. `current` is
#                 retained verbatim and `target` records the highest GA
#                 non-pre-release version the registry publishes.
#                 (Requirement 1.4)
#
#   superseded    The artifact is replaced by a differently named upstream
#                 artifact. `successor` and `source_url` name it.
#                 (Requirement 1.5)
#
#   no-source     No maintainer page or registry states a version for the
#                 component. `target` equals `current` and `source_url` is
#                 omitted. (Requirement 1.8)
#
#   mutable       `current` is a floating tag rather than a string identifying
#                 a single immutable artifact. `target` is a string that
#                 identifies one immutable artifact. (Requirement 1.9)
#
#   removed       The component is removed by this feature rather than
#                 upgraded. `successor` names its replacement and `target` is
#                 `n/a`. (Requirement 1.10)
#
# ---------------------------------------------------------------------------
# DUPLICATED REFERENCES
# ---------------------------------------------------------------------------
#
# A Duplicated_Reference produces one entry per file path, all sharing a
# `duplicate_group` value (Requirement 1 criterion 6). Every entry in a group
# carries the identical `target` string (Requirement 1 criterion 7).
# Verification check 9 asserts both directions: group membership implies target
# equality, and the value at each stated file path matches that target.
#
# ---------------------------------------------------------------------------
# STATE OF THIS FILE — enumeration and audit complete (tasks 1.2, 1.3)
# ---------------------------------------------------------------------------
#
# Every entry below is a Version_Reference verified present in the
# GitOps_Solution at the stated path and locator. No entry is
# illustrative-only, because Requirement 1 criterion 2 forbids an entry that
# does not correspond to an occurrence.
#
# Task 1.3 closed the two deferred pins, audited every `status` flag and
# every conditional-field rule, and completed `duplicate_group` assignment.
# Zero `<unresolved — task 1.3: ...>` strings remain. The audit state, as
# machine-checked over the 335 entries:
#
#   * status distribution — upgrade 280, removed 40, no-source 6, mutable 5,
#     unresolvable 4. Exactly one flag per entry, all six drawn from the
#     fixed set; no seventh flag was introduced (see FINDING 15). (The
#     openid-connect-provider thumbprint entry moved from `removed` to
#     `upgrade` when DERIVATION 2 was superseded by the documented
#     well-known root-CA constant; target now equals current — see that
#     entry's notes.)
#   * conditional fields — `successor` present exactly on the `superseded`
#     and `removed` entries, `source_url` present on every entry except the
#     six `no-source` ones, `consulted` present on every entry carrying a
#     `source_url`, and all seven required fields non-empty on all 335
#     entries (Requirement 1 criterion 3).
#   * duplicate groups — 65 groups over 295 entries; 40 entries are
