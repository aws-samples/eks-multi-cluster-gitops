# participant-run scripts hit "Permission denied" writing it, losing
# `SSH_PUB_KEY_ID`/`REPO_PREFIX`. Net: `setupCodeCommitSSHAccess` failed and
# (via FINDING 28b) the stack rolled back. FIX: (A) in the first setup step
# (`installK8sClientTools`, root) pre-create `/home/$OS_USER/.ssh` (0700) and
# `touch` + `chown` `/home/$OS_USER/.bash_profile` to the participant BEFORE
