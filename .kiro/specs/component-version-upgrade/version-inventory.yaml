# FINDING 28 (live end-to-end run, area G — two automated-setup defects). The
# automated setup path (`initial-setup/auto/cfn.yaml`) deployed live surfaced
# two defects, both now fixed in the tracked repository. Neither pins an
# artifact version, so neither adds an `entries` row; recorded here because
# both are consequences of the task 10.3/10.4 Cloud9 → VS Code
# Dev_Environment migration.
#   a. `~/environment` WORKSPACE DIR NOT CREATED. The retained setup SSM
#      documents run as `OS_USER=ec2-user` and `cd /home/$OS_USER/environment`
#      (and `cd ~/environment` inside their heredoc scripts). Cloud9 used to
#      auto-create `~/environment`; the VS Code Dev_Environment's
#      CodeEditorSSMDoc creates only `${DevEnvironmentHomeFolder}` (`/workshop`)
#      for the `participant` user, so `/home/ec2-user/environment` never
#      exists. Result: `cd: /home/ec2-user/environment: No such file or
#      directory`, then `git clone` fails with "could not create work tree dir
#      ... Permission denied", cascading to the dependent documents. This is
#      the same Cloud9-workspace assumption FINDING 8 flags for the OS guard —
#      an assumption task 10.3/10.4 did not carry into the new instance. FIX:
#      each of the five documents that use `~/environment` (`CloneWorkshopRepo`,
#      `CreateRootSealedSecretsEncryptionKeysDoc`, `SetupCodeCommitSSHAccessDoc`,
#      `CloneCodeCommitReposDoc`, `CreateIAMRoleForCrossplaneDoc`) now runs
#      `mkdir -p /home/$OS_USER/environment && chown $OS_USER:
#      /home/$OS_USER/environment` immediately after its `case`/`esac`
#      OS_USER block and before the first `cd` — a self-contained,
#      order-independent per-document step.
#   b. CODEBUILD MASKED SETUP FAILURES. In the `BuildProject` BuildSpec
#      `build` phase, both callers captured setup status with command
#      substitution: `EXIT_CODE=$(process_command_status ...)`.
#      `process_command_status` echoes progress to stdout and signals failure
#      via `return`, so `$(...)` captured the progress TEXT rather than the
#      numeric return code; the failure was lost,
#      `CODEBUILD_BUILD_SUCCEEDING` stayed 1, and `post_build` signalled
#      SUCCESS to the WaitCondition — the stack reported CREATE_COMPLETE even
#      when the SSM setup commands had failed. FIX (both the
#      Configure-Workshop-Environment and Bootstrap-Git-And-Management-Cluster
#      call sites): call `process_command_status` directly, capture its return
#      code with `EXIT_CODE=$?`, and `exit $EXIT_CODE` (not `return`) on
#      non-zero so the build command terminates non-zero → CodeBuild marks the
#      build failed → `post_build` signals FAILURE → the stack rolls back.
#      `process_command_status`'s own logic is unchanged.

