# 2.2.2 did not require. The offline values-schema diff in task 8.4 could not
# catch it because kubecost publishes no `values.schema.json`, so there was no
# machine-readable schema to diff; the requirement only surfaced in a live
# install. Resolution: set `spec.values.global.clusterId` and
# `global.clusterName` to `${CLUSTER_NAME}` in
# `repos/gitops-system/tools/kubecost/kubecost-release.yaml`, and add a
# `spec.postBuild.substituteFrom` referencing the `cluster-info` ConfigMap to
# `repos/gitops-system/clusters/template/kubecost.yaml` so `${CLUSTER_NAME}`
# resolves per cluster (same pattern as karpenter-config.yaml). This makes the
# clusterId cluster-specific, which is what kubecost expects for cost
# attribution across the multi-cluster fleet.
