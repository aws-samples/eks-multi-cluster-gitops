# FINDING 26 (live end-to-end run, area D). The EKS 1.35 workload cluster
# ships NO default StorageClass. The in-tree `gp2` default that older EKS
# provided is gone: the only StorageClass present is a non-default `gp2` still
# naming the REMOVED in-tree provisioner `kubernetes.io/aws-ebs`, which no
# longer provisions on 1.35. Consequence: PVC-backed add-ons whose PVCs leave
# `storageClassName` empty — kubecost `cost-analyzer` and its bundled
# `prometheus-server` — bind to nothing and their PVCs stay Pending, so the
# pods never start. Resolution (no node/driver change beyond what is already
# deployed): add a default `gp3` StorageClass backed by the EBS CSI driver
