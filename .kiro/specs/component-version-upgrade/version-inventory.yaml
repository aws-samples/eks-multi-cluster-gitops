#
# ---------------------------------------------------------------------------
# SCAN SCOPE — what is enumerated, and what is deliberately not
# ---------------------------------------------------------------------------
#
# Requirement 1 criterion 2 is bidirectional, so the scope boundary has to be
# written down for the criterion to be decidable. Enumerated:
#
#   * Helm chart versions, container image references carrying a tag,
#     Crossplane package references, Kubernetes cluster versions, CLI tool
#     versions in scripts and documentation, Python distribution pins, npm
#     package pins.
#   * API group-versions of the third-party controllers this solution pins:
#     Flux (`*.toolkit.fluxcd.io`), Crossplane (`*.crossplane.io`), Karpenter
#     (`karpenter.sh`, `karpenter.k8s.aws`), External Secrets
#     (`external-secrets.io`), Sealed Secrets (`bitnami.com`), kustomize
#     (`kustomize.config.k8s.io`), eksctl (`eksctl.io`), and the solution's own
#     composite API (`gitops.k8s.aws`, recorded `no-source`).
#   * Group-versions stated OUTSIDE a resource's own `apiVersion`. Three
#     distinct occurrence sites exist in this repository, not the two the
#     design names — see FINDING 3 below.
#
# NOT enumerated, each for a stated reason:
#
#   * Core Kubernetes GA group-versions — `v1`, `apps/v1`, `batch/v1`,
#     `rbac.authorization.k8s.io/v1`, `networking.k8s.io/v1`,
#     `apiextensions.k8s.io/v1`. These are APIs of the cluster itself; their
#     availability tracks Target_Kubernetes_Version rather than any pinned
#     third-party artifact, nothing in this upgrade changes them, and no
#     Correctness Property quantifies over them.
#   * Fixed schema/format identifiers that have no upstream release stream:
#     `AWSTemplateFormatVersion: "2010-09-09"`, IAM policy
#     `Version: 2012-10-17` (7 occurrences), SSM document
#     `schemaVersion: "2.2"` (10 occurrences), the CodeBuild buildspec
#     `version: 0.2` (`cfn.yaml` line 1295), and `lockfileVersion: 2` in
#     `package-lock.json`.
#   * `repos/apps/product-catalog-fe/package-lock.json` resolved dependency
#     versions (272 `resolved` entries). The lockfile is a generated artifact
#     regenerated wholesale in task 11.2 from the ranges in `package.json`,
#     which ARE enumerated. Recording 272 derived pins would create 272
#     entries that no edit targets.
#   * Image references that state a repository but no tag —
#     `kubecost-release.yaml` `kubecostFrontend.image`, `kubecostModel.image`,
#     `networkCosts.image.repository`, `clusterController.image.repository`,
#     `prometheus.server.image.repository`,
#     `prometheus.configmapReload.prometheus.image.repository`. A
#     Version_Reference is an occurrence of a *version string*; these carry
#     none, taking their tag from the chart. They are listed here so their
#     absence is deliberate rather than an omission.
#   * `pod-security.kubernetes.io/warn-version: latest` in
#     `clusters-config/template/secrets/namespace.yaml` — a Pod Security
#     Admission setting whose literal value is `latest`, not an artifact tag.
#   * `latest` inside URLs that are not artifact selectors: IMDS paths
#     (`169.254.169.254/latest/...`, 3 occurrences) and AWS documentation
#     links (`docs.aws.amazon.com/.../latest/...`).
#   * Unpinned installers that state no version string at all: the AWS CLI v2
#     installer in `initial-setup/README.md` (line 79), and the `kubeseal` and
#     `yq` "resolve the latest release tag from a redirect" blocks in
#     `initial-setup/auto/cfn.yaml` (lines 284-288 and 299-303). These pin
#     nothing and contain no version string, so they are not
#     Version_References — but they are the reason `cfn.yaml` and
#     `initial-setup/README.md` disagree about `kubeseal` and `yq`, which
#     task 12.1 has to reconcile.
#   * Example version numbers in walkthrough prose that name the sample's own
#     application git tags (`scenarios.md` `v2.0`, 5 occurrences). These are
#     tutorial values for the reader's own tags, not third-party pins.
#   * `initial-setup/auto/reference/code-editor.yaml`. It is an untracked
#     reference template that task 10.3 copies *resource patterns* from; it is
#     not itself deployed by the GitOps_Solution and is not listed among the
#     task 1.2 surfaces. If the finished tree ends up carrying it as a
#     tracked file, its pins need a follow-up scan.
#
# ONE DOCUMENTED GRANULARITY EXCEPTION. The distribution version label
# `app.kubernetes.io/version: v2.1.2` appears 35 times in each
# `gotk-components.yaml` — once on every object in a wholly generated file.
# It is recorded as one entry per file rather than 35, with the locator naming
# the label key and the occurrence count. Everything else, including repeated
# group-versions within a single file, is enumerated per occurrence. The
# rationale: `file` stays a single path (which is the constraint that matters
# for check 9), 70 byte-identical entries would add no verification power, and
# check 9 can still decide the criterion by asserting that *every* occurrence
# of that label in that file equals the target. Flagged here so task 1.3 can
# overrule it.
#
