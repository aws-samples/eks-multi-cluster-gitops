# `repos/gitops-system/tools/aws-ebs-csi/storageclass-gp3.yaml`, added to the
# `resources` list of that directory's `kustomization.yaml`. The EBS CSI
# HelmRelease that backs it is already deployed from the same directory, so
# the StorageClass rides the existing tools sync with no new dependency. This
# is an environment behaviour the offline version scan could not see; it pins
# no artifact version and adds no Version_Reference, so no `entries` row is
# recorded for it.
