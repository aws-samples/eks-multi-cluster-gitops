# FINDING 32 (live end-to-end run, area G — sixth automated-setup defect,
# surfaced by the FINDING 31 participant migration). Running the setup as the
# `participant` user (FINDING 31) exposed that two setup scripts assumed login
# state that only `ec2-user` had by default: (1) `setup_codecommit_ssh.sh`
# does `cd ~/.ssh`, but a freshly `adduser`-created `participant` has no
# `~/.ssh` (ec2-user gets one at launch) — `cd` failed, so the ssh keypair was
